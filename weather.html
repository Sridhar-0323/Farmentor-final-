<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Updates - FarmMentor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="glass-panel">
        <a href="index.html" class="logo">
            <span>🌱</span> FarmMentor
        </a>
        <div class="nav-links">
            <a href="index.html" data-i18n="nav_home">Home</a>
            <a href="weather.html" class="active" data-i18n="nav_weather">Weather</a>
            <a href="market.html" data-i18n="nav_market">Market</a>
            <a href="news.html" data-i18n="nav_news">News</a>
            <a href="chatbot.html" data-i18n="nav_chatbot">AI Support</a>
            <select id="langSelector" class="lang-selector" onchange="changeLanguage(this.value)">
                <option value="en">English</option>
                <option value="ta">தமிழ் (Tamil)</option>
                <option value="hi">हिन्दी (Hindi)</option>
                <option value="te">తెలుగు (Telugu)</option>
            </select>
        </div>
    </nav>

    <div class="container">
        <header class="page-header">
            <h1 data-i18n="card_weather_title">Weather Updates</h1>
            <p data-i18n="weather_header_desc">Check the real-time weather for your city to plan ahead.</p>
        </header>

        <main>
            <div class="input-group glass-panel" style="padding: 1rem; border-radius: 50px;">
                <input type="text" id="cityInput" placeholder="Enter your city name..." data-i18n="weather_placeholder">
                <button class="btn" onclick="fetchWeather()" data-i18n="btn_search">Search</button>
            </div>

            <div id="weatherLoader" class="loader"></div>

            <div id="weatherResult" class="result-container glass-panel">
                <div class="weather-info">
                    <h2 id="cityName" style="color: var(--darker-green);" data-i18n="city_name_placeholder">City Name</h2>
                    <div class="temp" id="temperature">--°C</div>
                    <div style="font-size: 1.5rem; color: #555;" id="condition" data-i18n="condition_placeholder">Condition</div>
                    
                    <div class="weather-details">
                        <div class="detail-item">
                            <span class="detail-label" data-i18n="weather_humidity">Humidity</span>
                            <span class="detail-value" id="humidity">--%</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label" data-i18n="weather_wind">Wind Speed</span>
                            <span class="detail-value" id="windSpeed">-- m/s</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="translations.js"></script>
    <script src="script.js"></script>
</body>
</html>
