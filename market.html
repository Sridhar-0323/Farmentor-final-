<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Prices - FarmMentor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="glass-panel">
        <a href="index.html" class="logo">
            <span>🌱</span> FarmMentor
        </a>
        <div class="nav-links">
            <a href="index.html" data-i18n="nav_home">Home</a>
            <a href="weather.html" data-i18n="nav_weather">Weather</a>
            <a href="market.html" class="active" data-i18n="nav_market">Market</a>
            <a href="news.html" data-i18n="nav_news">News</a>
            <a href="chatbot.html" data-i18n="nav_chatbot">AI Support</a>
            <select id="langSelector" class="lang-selector" onchange="changeLanguage(this.value)">
                <option value="en">English</option>
                <option value="ta">தமிழ் (Tamil)</option>
                <option value="hi">हिन्दी (Hindi)</option>
                <option value="te">తెలుగు (Telugu)</option>
            </select>
        </div>
    </nav>

    <div class="container">
        <header class="page-header">
            <h1 data-i18n="market_header_title">Market Prices</h1>
            <p data-i18n="market_header_desc">Latest market prices for essential crops.</p>
        </header>

        <main>
            <div class="input-group glass-panel" style="padding: 1rem; border-radius: 50px;">
                <input type="text" id="marketInput" placeholder="Search for a crop (e.g. Rice)..." data-i18n="market_placeholder">
                <button class="btn" onclick="filterMarket()" data-i18n="btn_search">Search</button>
            </div>

            <div id="marketGrid" class="market-grid">
                <!-- Data populated by JS -->
            </div>
        </main>
    </div>

    <script src="translations.js"></script>
    <script src="script.js"></script>
</body>
</html>
